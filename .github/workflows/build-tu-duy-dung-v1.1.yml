name: Build Tu Duy Dung Book App V4.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tu-duy-dung-bookapp/**'
      - '.github/workflows/build-tu-duy-dung-v1.1.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m py_compile app.py content.py stories.py learning_data.py i18n_en.py i18n_extra.py v42_data.py v42_ui.py validate.py

      - name: Validate all V4.2 data
        working-directory: tu-duy-dung-bookapp
        run: |
          python validate.py

      - name: V4.2 feature smoke test
        working-directory: tu-duy-dung-bookapp
        shell: powershell
        timeout-minutes: 2
        run: |
          python -u -c "import app; a=app.App(); print('app'); a.show_lesson('1.1'); print('lesson'); a.show_quiz('1.1'); print('quiz4',len(a.quiz_vi['1.1'])); assert len(a.quiz_vi['1.1'])==4; a.show_review(); print('review'); a.show_case_lab(reset=True); print('case-lab'); a.show_workbench('risk'); print('workbench-risk'); a.show_workbench('decision'); print('workbench-decision'); a.show_notes('1.1'); print('notes'); a.show_tools(); a.show_glossary(); a.show_progress(); print('legacy-features'); a.destroy(); print('V4.2 smoke test OK')"

      - name: Build portable EXE
        working-directory: tu-duy-dung-bookapp
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "TuDuyDung_BookApp_V4.2" app.py

      - name: Verify EXE exists
        shell: powershell
        run: |
          if (-not (Test-Path "tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V4.2.exe")) { throw "EXE not found" }
          $size=(Get-Item "tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V4.2.exe").Length
          if ($size -lt 1000000) { throw "EXE size looks invalid: $size" }
          Write-Host "EXE size: $size bytes"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuDuyDung_BookApp_V4.2_Windows
          path: tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V4.2.exe
          if-no-files-found: error
