name: Build Tu Duy Dung Book App V1.4.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tu-duy-dung-bookapp/**'
      - '.github/workflows/build-tu-duy-dung-v1.1.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m py_compile app.py content.py

      - name: Validate lesson data
        working-directory: tu-duy-dung-bookapp
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from content import CHAPTERS
          valid_styles = {"flow","steps","matrix","compare","ladder","cycle"}
          lessons = [lesson for chapter in CHAPTERS for lesson in chapter["lessons"]]
          assert len(lessons) == 40, f"Expected 40 lessons, got {len(lessons)}"
          required = ["id","title","summary","concept","method","example","checklist","blocks","style","why","mistakes","practice","reflect"]
          for lesson in lessons:
              missing = [k for k in required if k not in lesson]
              assert not missing, f'{lesson.get("id","?")} missing fields: {missing}'
              assert isinstance(lesson["blocks"], list) and lesson["blocks"], f'{lesson["id"]}: blocks must be a non-empty list'
              assert all(isinstance(x,(list,tuple)) and len(x)>=2 for x in lesson["blocks"]), f'{lesson["id"]}: invalid block'
              assert isinstance(lesson["checklist"], list) and lesson["checklist"], f'{lesson["id"]}: checklist must be a non-empty list'
              assert isinstance(lesson["mistakes"], list), f'{lesson["id"]}: mistakes must be a list'
              assert isinstance(lesson["reflect"], list), f'{lesson["id"]}: reflect must be a list'
              assert lesson["style"] in valid_styles, f'{lesson["id"]}: invalid style {lesson["style"]}'
          print(f"Validated {len(lessons)} lessons successfully")

      - name: Build portable EXE
        working-directory: tu-duy-dung-bookapp
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "TuDuyDung_BookApp_V1.4.2" app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuDuyDung_BookApp_V1.4.2_Windows
          path: tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V1.4.2.exe
          if-no-files-found: error
