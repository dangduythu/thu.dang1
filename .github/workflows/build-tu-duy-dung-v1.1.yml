name: Build Tu Duy Dung Book App V2.5

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tu-duy-dung-bookapp/**'
      - '.github/workflows/build-tu-duy-dung-v1.1.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m py_compile app.py content.py learning_data.py validate.py

      - name: Validate all V2.5 learning data
        working-directory: tu-duy-dung-bookapp
        run: |
          python validate.py

      - name: GUI smoke test
        working-directory: tu-duy-dung-bookapp
        shell: powershell
        run: |
          python -c "import app; a=app.App(); a.update_idletasks(); a.show_lesson('1.1'); a.update_idletasks(); a.show_lesson('6.1'); a.update_idletasks(); a.show_quiz('1.2'); a.update_idletasks(); a.show_cases(); a.update_idletasks(); a.show_tools(); a.update_idletasks(); a.show_glossary(); a.update_idletasks(); a.show_progress(); a.update_idletasks(); a.destroy(); print('GUI smoke test OK')"

      - name: Build portable EXE
        working-directory: tu-duy-dung-bookapp
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "TuDuyDung_BookApp_V2.5" app.py

      - name: Verify EXE exists
        shell: powershell
        run: |
          if (-not (Test-Path "tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V2.5.exe")) { throw "EXE not found" }
          $size=(Get-Item "tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V2.5.exe").Length
          if ($size -lt 1000000) { throw "EXE size looks invalid: $size" }
          Write-Host "EXE size: $size bytes"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuDuyDung_BookApp_V2.5_Windows
          path: tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V2.5.exe
          if-no-files-found: error
