name: Build Tu Duy Dung Book App V1.4.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tu-duy-dung-bookapp/**'
      - '.github/workflows/build-tu-duy-dung-v1.1.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        working-directory: tu-duy-dung-bookapp
        run: |
          python -m py_compile app.py content.py

      - name: Build portable EXE
        working-directory: tu-duy-dung-bookapp
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "TuDuyDung_BookApp_V1.4.2" app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuDuyDung_BookApp_V1.4.2_Windows
          path: tu-duy-dung-bookapp/dist/TuDuyDung_BookApp_V1.4.2.exe
          if-no-files-found: error
