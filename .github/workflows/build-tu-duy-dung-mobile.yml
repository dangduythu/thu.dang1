name: Build Tu Duy Dung Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tu-duy-dung-mobile/**'
      - 'tu-duy-dung-bookapp/**'
      - '.github/workflows/build-tu-duy-dung-mobile.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export V4.2 content to mobile JSON
        run: python tu-duy-dung-mobile/scripts/export_content.py

      - name: Validate exported content
        working-directory: tu-duy-dung-mobile
        run: |
          python - <<'PY'
          import json
          d=json.load(open('src/data/book.json',encoding='utf-8'))
          lessons=[x for c in d['chapters'] for x in c['lessons']]
          assert len(d['chapters'])==10
          assert len(lessons)==40
          assert len(d['stories'])==40
          assert len(d['multiCases'])>=3
          assert len(d['workbenchTemplates'])>=7
          assert all(len(d['quizVi'][x['id']])==4 for x in lessons)
          assert all(len(d['quizEn'][x['id']])==4 for x in lessons)
          print('Mobile content validation OK')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'
          cache-dependency-path: tu-duy-dung-mobile/package.json

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK and install API 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        working-directory: tu-duy-dung-mobile
        run: |
          npm install
          npx expo install react-native-safe-area-context @react-native-async-storage/async-storage

      - name: Expo bundle smoke test
        working-directory: tu-duy-dung-mobile
        run: npx expo export --platform android --output-dir dist-bundle

      - name: Generate Android project
        working-directory: tu-duy-dung-mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build installable debug APK
        working-directory: tu-duy-dung-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp tu-duy-dung-mobile/android/app/build/outputs/apk/debug/app-debug.apk TuDuyDung_Mobile_V1.0.apk
          test -s TuDuyDung_Mobile_V1.0.apk
          ls -lh TuDuyDung_Mobile_V1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuDuyDung_Mobile_V1.0_APK
          path: TuDuyDung_Mobile_V1.0.apk
          if-no-files-found: error
